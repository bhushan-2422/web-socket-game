<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Game Lobby</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body,
      .container {
        margin: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }
      /* body{
        background-color: black;
      } */
      .hidden {
        display: none;
      }

      body {
        background: #080c14;
        color: #cfe4ff;
        font-family: "Rajdhani", sans-serif;
        overflow: hidden;
      }

      /* VIDEO */
      .video-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
        filter: brightness(0.35) contrast(1.2);
      }

      /* GRID */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
        background-size: 40px 40px;
      }

      /* PAGE */
      .page {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      /* TITLE */
      .logo-tag {
        font-family: "Share Tech Mono";
        color: #00e5ff;
        border: 1px solid #00e5ff;
        padding: 3px 10px;
        margin-bottom: 10px;
        font-size: 12px;
      }

      h1 {
        font-family: "Orbitron";
        font-size: 60px;
        color: #fff;
        text-shadow: 0 0 20px #00e5ff;
      }
      h1 span {
        color: #ff6d00;
        text-shadow: 0 0 20px #ff6d00;
      }

      .subtitle {
        margin: 10px 0 30px;
        letter-spacing: 2px;
      }

      /* CARD */
      .card {
        width: 420px;
        background: rgba(10, 20, 40, 0.85);
        border: 1px solid #1e3a5f;
        padding: 30px;
        position: relative;
      }

      /* CORNERS */
      .card::before,
      .card::after {
        content: "";
        position: absolute;
        width: 15px;
        height: 15px;
        border: 2px solid #00e5ff;
      }
      .card::before {
        top: -1px;
        left: -1px;
        border-right: none;
        border-bottom: none;
      }
      .card::after {
        bottom: -1px;
        right: -1px;
        border-left: none;
        border-top: none;
      }

      .card .corner-tr,
      .card .corner-bl {
        position: absolute;
        width: 15px;
        height: 15px;
        border: 2px solid #ff6d00;
      }
      .corner-tr {
        top: -1px;
        right: -1px;
        border-left: none;
        border-bottom: none;
      }
      .corner-bl {
        bottom: -1px;
        left: -1px;
        border-right: none;
        border-top: none;
      }

      .card-title {
        font-family: "Orbitron";
        color: #00e5ff;
        margin-bottom: 20px;
        letter-spacing: 2px;
      }

      /* INPUT */
      label {
        font-size: 12px;
        color: #5a7fa8;
      }

      input {
        width: 100%;
        margin: 8px 0 15px;
        padding: 10px;
        background: #0d1525;
        border: 1px solid #1e3a5f;
        color: #fff;
      }

      input:focus {
        outline: none;
        border-color: #00e5ff;
      }

      /* BUTTON */
      button {
        /* width: 100%; */
        padding: 12px;
        background: transparent;
        border: 1px solid #00e5ff;
        color: #00e5ff;
        font-family: "Orbitron";
        cursor: pointer;
      }

      button:hover {
        background: #00e5ff;
        color: #000;
        box-shadow: 0 0 20px #00e5ff;
      }

      /* PLAYERS */
      .divider {
        text-align: center;
        margin: 20px 0;
        font-size: 12px;
      }

      .player-slot {
        padding: 10px;
        border: 1px dashed #1e3a5f;
        margin-bottom: 8px;
        font-size: 12px;
      }

      /* STATUS */
      .status {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        margin-top: 20px;
      }
      #game-wrapper {
        position: relative; /* 🔥 REQUIRED */
        width: 100vw;
        height: 100vh;
      }

      #game-container {
        width: 100%;
        height: 100%;
      }

      /* BUTTONS */
      #menuBtn,
      #chatBtn {
        position: absolute;
        top: 15px;
        z-index: 1000;
        padding: 10px 14px;
        font-size: 18px;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid #00e5ff;
        color: #00e5ff;
        cursor: pointer;
      }

      #menuBtn {
        left: 15px;
      }
      #chatBtn {
        right: 15px;
      }

      /* PANELS */
      .panel {
        position: absolute;
        top: 0;
        width: 280px;
        height: 100%;
        background: rgba(5, 10, 20, 0.95);
        color: white;
        z-index: 999;
        padding: 20px;
        transition: transform 0.3s ease;
      }

      /* HIDDEN STATES */
      .left-panel {
        left: 0;
        transform: translateX(-100%);
      }

      .right-panel {
        right: 0;
        transform: translateX(100%);
      }

      /* SHOW */
      .panel.show {
        transform: translateX(0);
      }
      .btn-container {
        display: flex;
        justify-content: space-between;
        padding: 10px;
      }
      #game-container {
        position: absolute;
        inset: 0;
      }

      /* #exit-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(10, 10, 20, 0.9);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999;
      } */

      #exit-screen.visible {
  display: flex;   /* shown only when .visible is added */
  justify-content: center;
  align-items: center;
}


      .exit-card {
        background: linear-gradient(145deg, #1c1f2b, #2a2e3f);
        border-radius: 15px;
        padding: 30px;
        width: 400px;
        text-align: center;
        color: white;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
      }

      .exit-card h1 {
        margin-bottom: 20px;
        font-size: 32px;
        color: #4cafef;
      }

      .stats {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      .stat-box {
        background: #11131a;
        padding: 15px;
        border-radius: 10px;
        width: 45%;
      }

      .stat-box h2 {
        margin-top: 5px;
        color: #00ffcc;
      }

      #leaderboard {
        margin-top: 15px;
      }

      #leaderboard ul {
        list-style: none;
        padding: 0;
      }

      #leaderboard li {
        background: #151824;
        margin: 5px 0;
        padding: 8px;
        border-radius: 5px;
      }

      .actions {
        margin-top: 20px;
      }

      .actions button {
        margin: 5px;
        padding: 10px 15px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
      }

      #play-again {
        background: #4caf50;
        color: white;
      }

      #exit-game {
        background: #f44336;
        color: white;
      }

    </style>
  </head>

  <body>
    <!-- <div class="container hidden" id="game-container"></div> -->
    <div id="game-wrapper" class="hidden">
      <!-- GAME -->
      <div class="container" id="game-container"></div>

      <!-- BUTTONS -->
      <div class="btn-container">
        <button id="menuBtn">☰</button>
        <button id="chatBtn">💬</button>
      </div>

      <!-- LEFT PANEL -->
      <div id="menuPanel" class="panel left-panel">
        <h3>Menu</h3>
        <p>Exit / Settings / Stats</p>
      </div>

      <!-- RIGHT PANEL -->
      <div id="chatPanel" class="panel right-panel">
        <h3>Messages</h3>
        <div id="messages"></div>
      </div>
    </div>

    <div class="page" id="joiner">
      <!-- VIDEO -->
      <video autoplay muted loop playsinline class="video-bg">
        <source src="./background.mp4" type="video/mp4" />
      </video>

      <div class="logo-tag">△ ARENA ONLINE</div>

      <h1>GAME <span>LOBBY</span></h1>
      <p class="subtitle">ENTER YOUR CREDENTIALS & JOIN THE BATTLE</p>

      <div class="card">
        <div class="corner-tr"></div>
        <div class="corner-bl"></div>

        <div class="card-title">ROOM CONFIGURATION</div>

        <form id="create-room">
          <label>ROOM ID</label>
          <input type="text" id="roomId" placeholder="e.g. ARENA-4291" />

          <label>PLAYER NAME</label>
          <input
            type="text"
            id="playerName"
            placeholder="Enter your callsign"
          />

          <label>ROOM SIZE</label>
          <input
            type="text"
            id="minPlayers"
            placeholder="Max players (e.g. 4)"
          />

          <button type="submit">▶ LAUNCH GAME</button>
        </form>

        <div class="divider">Players in lobby</div>

        <div class="player-slot" id="players"></div>
      </div>
    </div>

    <div id="exit-screen" class="">
      <div class="exit-card">
        <h1>🏁 Escaped!</h1>

        <div class="stats">
          <div class="stat-box">
            <p>Your Time</p>
            <h2 id="your-time">0s</h2>
          </div>

          <div class="stat-box">
            <p>Average Time</p>
            <h2 id="avg-time">0s</h2>
          </div>
        </div>

        <div id="leaderboard">
          <h3>Leaderboard</h3>
          <ul id="leaderboard-list"></ul>
        </div>

        <div class="actions">
          <button id="play-again">Play Again</button>
          <button id="exit-game">Exit</button>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
